<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frida's Notebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf6f0;
            --surface: #ffffff;
            --surface-2: #f3ece2;
            --ink: #2b2420;
            --ink-soft: #6b5f57;
            --line: #e4d9cc;
            --recipe: #c8553d;
            --recipe-soft: #fbe6df;
            --outfit: #5b6ee1;
            --outfit-soft: #e5e8fb;
            --accent: var(--recipe);
            --accent-soft: var(--recipe-soft);
            --danger: #b3261e;
            --on-accent: #ffffff;
            --shadow: 0 1px 2px rgba(43, 36, 32, 0.06), 0 6px 20px rgba(43, 36, 32, 0.07);
            --radius: 16px;
        }

        body.mode-outfit {
            --accent: var(--outfit);
            --accent-soft: var(--outfit-soft);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1917;
                --surface: #262220;
                --surface-2: #322d2a;
                --ink: #f3ede7;
                --ink-soft: #b5aaa1;
                --line: #3d3733;
                --recipe: #ec8a72;
                --recipe-soft: #3f2a24;
                --outfit: #95a3f5;
                --outfit-soft: #2a2e47;
                --danger: #f2948d;
                --on-accent: #1c1917;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 700;
            line-height: 1.2;
        }

        button, input, textarea, select {
            font: inherit;
            color: inherit;
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Header */
        header {
            padding: 32px 0 8px;
        }

        .brand {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand h1 {
            font-size: clamp(2rem, 6vw, 3rem);
        }

        .brand h1 span {
            color: var(--accent);
        }

        .brand p {
            color: var(--ink-soft);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin: 24px 0 16px;
            border-bottom: 1px solid var(--line);
        }

        .tab {
            background: none;
            border: none;
            padding: 10px 4px;
            margin-right: 16px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--ink-soft);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -1px;
        }

        .tab[aria-selected="true"] {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab .count {
            font-weight: 600;
            font-size: 0.85rem;
            background: var(--surface-2);
            border-radius: 999px;
            padding: 1px 8px;
            margin-left: 6px;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
        }

        .search {
            flex: 1 1 220px;
            min-width: 0;
            padding: 11px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
        }

        .search:focus, .field input:focus, .field textarea:focus, .field select:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        select.sort {
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
        }

        .btn {
            border: 1px solid var(--line);
            background: var(--surface);
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--surface-2);
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }

        .btn.primary:hover {
            filter: brightness(1.07);
        }

        .btn.danger {
            color: var(--danger);
        }

        .chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .chip {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .chip.on {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 700;
        }

        /* Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
            padding-bottom: 40px;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            cursor: pointer;
            text-align: left;
            border: none;
            display: flex;
            flex-direction: column;
            transition: transform 0.15s;
        }

        .card:hover, .card:focus-visible {
            transform: translateY(-2px);
        }

        .card:focus-visible {
            outline: 2px solid var(--accent);
        }

        .card .thumb {
            aspect-ratio: 4 / 3;
            background: var(--accent-soft);
            display: grid;
            place-items: center;
            font-size: 3rem;
            overflow: hidden;
        }

        .card .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card .body {
            padding: 14px 16px 16px;
        }

        .card h3 {
            font-size: 1.15rem;
            margin-bottom: 4px;
        }

        .meta {
            color: var(--ink-soft);
            font-size: 0.9rem;
        }

        .hearts {
            color: var(--accent);
            letter-spacing: 1px;
        }

        .empty {
            text-align: center;
            padding: 60px 16px;
            color: var(--ink-soft);
        }

        .empty .big {
            font-size: 3rem;
            margin-bottom: 8px;
        }

        /* Dialogs */
        dialog {
            border: none;
            border-radius: 20px;
            background: var(--surface);
            color: var(--ink);
            width: min(640px, calc(100vw - 24px));
            max-height: calc(100vh - 32px);
            margin: auto;
            padding: 0;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        dialog::backdrop {
            background: rgba(20, 15, 12, 0.5);
        }

        .dlg-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 1;
        }

        .dlg-head h2 {
            font-size: 1.4rem;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            color: var(--ink-soft);
            padding: 4px 8px;
        }

        .dlg-body {
            padding: 20px;
        }

        .dlg-foot {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            padding: 14px 20px;
            border-top: 1px solid var(--line);
            position: sticky;
            bottom: 0;
            background: var(--surface);
            flex-wrap: wrap;
        }

        .dlg-foot .spacer {
            flex: 1;
        }

        /* Form */
        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 14px;
        }

        .field label {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .field .hint {
            color: var(--ink-soft);
            font-size: 0.85rem;
        }

        .field input, .field textarea, .field select {
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--bg);
            width: 100%;
        }

        .field textarea {
            min-height: 90px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 520px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        .rating-input {
            display: flex;
            gap: 4px;
        }

        .rating-input button {
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--line);
            padding: 0 2px;
        }

        .rating-input button.on {
            color: var(--accent);
        }

        .photo-drop {
            border: 2px dashed var(--line);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            color: var(--ink-soft);
        }

        .photo-drop img {
            max-width: 100%;
            max-height: 240px;
            border-radius: 8px;
            display: block;
            margin: 0 auto 8px;
        }

        /* Detail view */
        .detail-photo {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 16px;
            max-height: 420px;
            object-fit: cover;
        }

        .detail h3 {
            font-size: 1.05rem;
            margin: 18px 0 6px;
            color: var(--accent);
        }

        .detail ul, .detail ol {
            padding-left: 22px;
        }

        .detail li {
            margin-bottom: 4px;
        }

        .detail p {
            white-space: pre-wrap;
        }

        .facts {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .fact {
            background: var(--accent-soft);
            color: var(--ink);
            border-radius: 999px;
            padding: 3px 12px;
            font-size: 0.9rem;
        }

        footer {
            border-top: 1px solid var(--line);
            padding: 20px 0 40px;
            color: var(--ink-soft);
            font-size: 0.9rem;
        }

        footer .wrap {
            display: flex;
            gap: 10px 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        footer a {
            color: var(--accent);
        }

        footer .btn {
            padding: 6px 12px;
            font-size: 0.9rem;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--ink);
            color: var(--bg);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: transform 0.25s, opacity 0.25s, visibility 0.25s;
            z-index: 10;
            max-width: calc(100vw - 32px);
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap">
            <div class="brand">
                <h1>Frida's <span>Notebook</span></h1>
                <p>Recipes she's made and outfits she's loved.</p>
            </div>
            <nav class="tabs" role="tablist">
                <button class="tab" role="tab" id="tab-recipe" aria-selected="true" data-type="recipe">🍳 Recipes<span class="count" id="count-recipe">0</span></button>
                <button class="tab" role="tab" id="tab-outfit" aria-selected="false" data-type="outfit">👗 Outfits<span class="count" id="count-outfit">0</span></button>
            </nav>
        </div>
    </header>

    <main class="wrap">
        <div class="toolbar">
            <input class="search" id="search" type="search" placeholder="Search recipes..." aria-label="Search">
            <select class="sort" id="sort" aria-label="Sort">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="favourite">Favourites first</option>
                <option value="az">A to Z</option>
            </select>
            <button class="btn primary" id="add-btn">+ Add recipe</button>
        </div>
        <div class="chips" id="tags"></div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden></div>
    </main>

    <footer>
        <div class="wrap">
            <span>Everything is saved in this browser on this device.</span>
            <button class="btn" id="export-btn">Download backup</button>
            <button class="btn" id="import-btn">Restore backup</button>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
    </footer>

    <!-- Edit / add dialog -->
    <dialog id="edit-dlg">
        <form id="edit-form" method="dialog">
            <div class="dlg-head">
                <h2 id="edit-title">New recipe</h2>
                <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
            </div>
            <div class="dlg-body" id="edit-fields"></div>
            <div class="dlg-foot">
                <button type="button" class="btn" data-close>Cancel</button>
                <button type="submit" class="btn primary">Save</button>
            </div>
        </form>
    </dialog>

    <!-- Detail dialog -->
    <dialog id="view-dlg">
        <div class="dlg-head">
            <h2 id="view-title"></h2>
            <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
        </div>
        <div class="dlg-body detail" id="view-body"></div>
        <div class="dlg-foot">
            <button type="button" class="btn danger" id="delete-btn">Delete</button>
            <span class="spacer"></span>
            <button type="button" class="btn" id="edit-btn">Edit</button>
        </div>
    </dialog>

    <div class="toast" id="toast" role="status"></div>

    <script>
        // ---------- Config for each kind of entry ----------
        const TYPES = {
            recipe: {
                label: 'recipe',
                emoji: '🍳',
                fields: [
                    { key: 'title', label: 'Recipe name', type: 'text', required: true, placeholder: 'Chocolate banana muffins' },
                    { key: 'date', label: 'Date made', type: 'date' },
                    { key: 'rating', label: 'How good was it?', type: 'rating' },
                    { key: 'photo', label: 'Photo', type: 'photo' },
                    { row: [
                        { key: 'serves', label: 'Serves', type: 'text', placeholder: '4' },
                        { key: 'time', label: 'Time', type: 'text', placeholder: '45 minutes' }
                    ] },
                    { key: 'ingredients', label: 'Ingredients', type: 'textarea', hint: 'One per line', list: 'ul' },
                    { key: 'steps', label: 'Steps', type: 'textarea', hint: 'One step per line', list: 'ol' },
                    { key: 'notes', label: 'Notes', type: 'textarea', hint: 'What would you change next time? Who helped?' },
                    { key: 'tags', label: 'Tags', type: 'text', hint: 'Separate with commas, e.g. baking, dessert', placeholder: 'baking, sweet' }
                ],
                facts: ['serves', 'time'],
                factLabels: { serves: 'Serves ', time: '⏱ ' },
                search: ['title', 'ingredients', 'notes', 'tags']
            },
            outfit: {
                label: 'outfit',
                emoji: '👗',
                fields: [
                    { key: 'title', label: 'Outfit name', type: 'text', required: true, placeholder: 'Birthday party look' },
                    { key: 'date', label: 'Date worn', type: 'date' },
                    { key: 'rating', label: 'How much did she love it?', type: 'rating' },
                    { key: 'photo', label: 'Photo', type: 'photo' },
                    { row: [
                        { key: 'occasion', label: 'Occasion', type: 'text', placeholder: 'School, party, holiday...' },
                        { key: 'weather', label: 'Weather', type: 'text', placeholder: 'Sunny and warm' }
                    ] },
                    { key: 'items', label: 'What she wore', type: 'textarea', hint: 'One item per line', list: 'ul' },
                    { key: 'notes', label: 'Notes', type: 'textarea', hint: 'Favourite bit? Anything to swap?' },
                    { key: 'tags', label: 'Tags', type: 'text', hint: 'Separate with commas, e.g. summer, sparkly', placeholder: 'summer, favourite' }
                ],
                facts: ['occasion', 'weather'],
                factLabels: { occasion: '', weather: '☀ ' },
                search: ['title', 'items', 'occasion', 'notes', 'tags']
            }
        };

        // ---------- Storage (IndexedDB, so photos fit) ----------
        const DB_NAME = 'frida-notebook';
        const STORE = 'entries';
        let dbPromise;

        function openDb() {
            if (!dbPromise) {
                dbPromise = new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, 1);
                    req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: 'id' });
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }
            return dbPromise;
        }

        async function tx(mode, fn) {
            const db = await openDb();
            return new Promise((resolve, reject) => {
                const t = db.transaction(STORE, mode);
                const result = fn(t.objectStore(STORE));
                t.oncomplete = () => resolve(result && 'result' in result ? result.result : undefined);
                t.onerror = () => reject(t.error);
            });
        }

        const getAll = () => tx('readonly', s => s.getAll());
        const putEntry = entry => tx('readwrite', s => s.put(entry));
        const deleteEntry = id => tx('readwrite', s => s.delete(id));

        // ---------- State ----------
        let entries = [];
        let mode = 'recipe';
        let activeTag = null;
        let editing = null;   // entry being edited, or null for new
        let viewing = null;   // entry shown in the detail dialog
        let draftPhoto = null;
        let draftRating = 0;

        const $ = id => document.getElementById(id);

        // ---------- Helpers ----------
        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function splitLines(text) {
            return String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
        }

        function splitTags(text) {
            return String(text || '').split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
        }

        function hearts(n) {
            return n ? '♥'.repeat(n) : '';
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso + 'T00:00:00');
            return isNaN(d) ? iso : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function today() {
            const d = new Date();
            return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
        }

        function newId() {
            return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
        }

        function toast(msg) {
            const el = $('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toast.timer);
            toast.timer = setTimeout(() => el.classList.remove('show'), 2500);
        }

        // Shrink photos so the notebook stays light
        function resizePhoto(file, max = 1200) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const scale = Math.min(1, max / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', 0.82));
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('Could not read that image'));
                };
                img.src = url;
            });
        }

        // ---------- Rendering ----------
        function setMode(next) {
            mode = next;
            activeTag = null;
            document.body.classList.toggle('mode-outfit', mode === 'outfit');
            document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.type === mode));
            $('search').value = '';
            $('search').placeholder = `Search ${TYPES[mode].label}s...`;
            $('add-btn').textContent = `+ Add ${TYPES[mode].label}`;
            try { localStorage.setItem('frida-tab', mode); } catch (e) {}
            render();
        }

        function render() {
            const cfg = TYPES[mode];
            const ofType = entries.filter(e => e.type === mode);
            $('count-recipe').textContent = entries.filter(e => e.type === 'recipe').length;
            $('count-outfit').textContent = entries.filter(e => e.type === 'outfit').length;

            // Tag chips
            const tagCounts = {};
            ofType.forEach(e => splitTags(e.tags).forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1));
            const tags = Object.keys(tagCounts).sort();
            if (activeTag && !tagCounts[activeTag]) activeTag = null;
            $('tags').innerHTML = tags.map(t =>
                `<button class="chip${t === activeTag ? ' on' : ''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`
            ).join('');

            // Filter + sort
            const q = $('search').value.trim().toLowerCase();
            let list = ofType.filter(e => {
                if (activeTag && !splitTags(e.tags).includes(activeTag)) return false;
                if (!q) return true;
                return cfg.search.some(k => String(e[k] || '').toLowerCase().includes(q));
            });
            const byDate = e => e.date || e.createdAt || '';
            const sorters = {
                newest: (a, b) => byDate(b).localeCompare(byDate(a)),
                oldest: (a, b) => byDate(a).localeCompare(byDate(b)),
                favourite: (a, b) => (b.rating || 0) - (a.rating || 0) || byDate(b).localeCompare(byDate(a)),
                az: (a, b) => a.title.localeCompare(b.title)
            };
            list.sort(sorters[$('sort').value]);

            $('grid').innerHTML = list.map(e => `
                <button class="card" data-id="${e.id}">
                    <div class="thumb">${e.photo ? `<img src="${e.photo}" alt="">` : cfg.emoji}</div>
                    <div class="body">
                        <h3>${escapeHtml(e.title)}</h3>
                        <div class="meta">
                            ${escapeHtml(formatDate(e.date))}
                            ${e.rating ? `<span class="hearts" aria-label="${e.rating} out of 5">${hearts(e.rating)}</span>` : ''}
                        </div>
                    </div>
                </button>`).join('');

            const empty = $('empty');
            if (list.length) {
                empty.hidden = true;
            } else {
                empty.hidden = false;
                empty.innerHTML = ofType.length
                    ? `<div class="big">🔍</div>Nothing matches that search.`
                    : `<div class="big">${cfg.emoji}</div>No ${cfg.label}s yet. Tap <strong>+ Add ${cfg.label}</strong> to write the first one.`;
            }
        }

        // ---------- Add / edit ----------
        function fieldHtml(f, entry) {
            const val = entry[f.key] ?? '';
            const id = `f-${f.key}`;
            const hint = f.hint ? `<span class="hint">${f.hint}</span>` : '';
            if (f.type === 'rating') {
                return `<div class="field"><label>${f.label}</label>
                    <div class="rating-input" id="rating">${[1, 2, 3, 4, 5].map(n =>
                        `<button type="button" data-n="${n}" aria-label="${n} heart${n > 1 ? 's' : ''}">♥</button>`).join('')}
                    </div></div>`;
            }
            if (f.type === 'photo') {
                return `<div class="field"><label>${f.label}</label>
                    <div class="photo-drop" id="photo-drop" tabindex="0" role="button">
                        <div id="photo-preview"></div>
                        <span id="photo-label"></span>
                    </div>
                    <input type="file" id="photo-file" accept="image/*" hidden>
                    <button type="button" class="btn" id="photo-remove" style="margin-top:6px;align-self:flex-start" hidden>Remove photo</button>
                </div>`;
            }
            const req = f.required ? 'required' : '';
            const ph = f.placeholder ? `placeholder="${escapeHtml(f.placeholder)}"` : '';
            const input = f.type === 'textarea'
                ? `<textarea id="${id}" name="${f.key}" ${ph}>${escapeHtml(val)}</textarea>`
                : `<input id="${id}" name="${f.key}" type="${f.type}" value="${escapeHtml(val)}" ${ph} ${req}>`;
            return `<div class="field"><label for="${id}">${f.label}</label>${hint}${input}</div>`;
        }

        function updateRating() {
            document.querySelectorAll('#rating button').forEach(b =>
                b.classList.toggle('on', Number(b.dataset.n) <= draftRating));
        }

        function updatePhoto() {
            $('photo-preview').innerHTML = draftPhoto ? `<img src="${draftPhoto}" alt="">` : '';
            $('photo-label').textContent = draftPhoto ? 'Tap to change photo' : '📷 Tap to add a photo';
            $('photo-remove').hidden = !draftPhoto;
        }

        function openEditor(entry) {
            editing = entry || null;
            const type = entry ? entry.type : mode;
            const cfg = TYPES[type];
            const data = entry || { date: today() };
            draftPhoto = data.photo || null;
            draftRating = data.rating || 0;

            $('edit-title').textContent = entry ? `Edit ${cfg.label}` : `New ${cfg.label}`;
            $('edit-fields').innerHTML = cfg.fields.map(f =>
                f.row ? `<div class="row">${f.row.map(r => fieldHtml(r, data)).join('')}</div>` : fieldHtml(f, data)
            ).join('');

            updateRating();
            updatePhoto();
            $('rating').addEventListener('click', e => {
                const n = Number(e.target.dataset.n);
                if (!n) return;
                draftRating = draftRating === n ? 0 : n;
                updateRating();
            });
            const pick = () => $('photo-file').click();
            $('photo-drop').addEventListener('click', pick);
            $('photo-drop').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
            $('photo-file').addEventListener('change', async e => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    draftPhoto = await resizePhoto(file);
                    updatePhoto();
                } catch (err) {
                    toast(err.message);
                }
            });
            $('photo-remove').addEventListener('click', () => { draftPhoto = null; updatePhoto(); });

            $('edit-dlg').showModal();
            $('f-title').focus();
        }

        async function saveEditor(e) {
            e.preventDefault();
            const form = new FormData($('edit-form'));
            const type = editing ? editing.type : mode;
            const entry = {
                ...(editing || { id: newId(), type, createdAt: new Date().toISOString() }),
                rating: draftRating,
                photo: draftPhoto,
                updatedAt: new Date().toISOString()
            };
            for (const [k, v] of form.entries()) {
                if (typeof v === 'string') entry[k] = v.trim();
            }
            if (!entry.title) return;
            try {
                await putEntry(entry);
            } catch (err) {
                toast('Could not save. The browser may be out of space.');
                return;
            }
            const i = entries.findIndex(x => x.id === entry.id);
            if (i >= 0) entries[i] = entry; else entries.push(entry);
            $('edit-dlg').close();
            toast(editing ? 'Saved changes' : `Added "${entry.title}"`);
            render();
            if (editing && viewing && viewing.id === entry.id) openViewer(entry);
        }

        // ---------- View ----------
        function openViewer(entry) {
            viewing = entry;
            const cfg = TYPES[entry.type];
            document.body.classList.toggle('mode-outfit', entry.type === 'outfit');
            $('view-title').textContent = entry.title;

            let html = '';
            if (entry.photo) html += `<img class="detail-photo" src="${entry.photo}" alt="">`;
            html += `<div class="meta">${escapeHtml(formatDate(entry.date))}
                ${entry.rating ? ` <span class="hearts">${hearts(entry.rating)}</span>` : ''}</div>`;

            const facts = cfg.facts.filter(k => entry[k])
                .map(k => `<span class="fact">${cfg.factLabels[k]}${escapeHtml(entry[k])}</span>`);
            const tags = splitTags(entry.tags).map(t => `<span class="fact">#${escapeHtml(t)}</span>`);
            if (facts.length || tags.length) html += `<div class="facts">${facts.join('')}${tags.join('')}</div>`;

            cfg.fields.forEach(f => {
                if (!f.list && f.key !== 'notes') return;
                const val = entry[f.key];
                if (!val) return;
                html += `<h3>${f.label}</h3>`;
                if (f.list) {
                    html += `<${f.list}>${splitLines(val).map(l => `<li>${escapeHtml(l)}</li>`).join('')}</${f.list}>`;
                } else {
                    html += `<p>${escapeHtml(val)}</p>`;
                }
            });

            $('view-body').innerHTML = html;
            if (!$('view-dlg').open) $('view-dlg').showModal();
        }

        // ---------- Backup ----------
        function exportBackup() {
            const blob = new Blob([JSON.stringify({ app: 'frida-notebook', version: 1, entries }, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `frida-notebook-${today()}.json`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }

        async function importBackup(file) {
            try {
                const data = JSON.parse(await file.text());
                const incoming = Array.isArray(data) ? data : data.entries;
                if (!Array.isArray(incoming)) throw new Error();
                const valid = incoming.filter(e => e && e.id && e.title && TYPES[e.type]);
                for (const e of valid) await putEntry(e);
                entries = await getAll();
                render();
                toast(`Restored ${valid.length} entr${valid.length === 1 ? 'y' : 'ies'}`);
            } catch (err) {
                toast("That file doesn't look like a notebook backup");
            }
        }

        // ---------- Wiring ----------
        document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setMode(t.dataset.type)));
        $('search').addEventListener('input', render);
        $('sort').addEventListener('change', render);
        $('add-btn').addEventListener('click', () => openEditor(null));
        $('tags').addEventListener('click', e => {
            const tag = e.target.dataset.tag;
            if (!tag) return;
            activeTag = activeTag === tag ? null : tag;
            render();
        });
        $('grid').addEventListener('click', e => {
            const card = e.target.closest('.card');
            if (card) openViewer(entries.find(x => x.id === card.dataset.id));
        });
        $('edit-form').addEventListener('submit', saveEditor);
        $('edit-btn').addEventListener('click', () => openEditor(viewing));
        $('delete-btn').addEventListener('click', async () => {
            if (!viewing || !confirm(`Delete "${viewing.title}"? This can't be undone.`)) return;
            await deleteEntry(viewing.id);
            entries = entries.filter(x => x.id !== viewing.id);
            $('view-dlg').close();
            toast('Deleted');
            render();
        });
        $('view-dlg').addEventListener('close', () => {
            viewing = null;
            document.body.classList.toggle('mode-outfit', mode === 'outfit');
        });
        document.querySelectorAll('[data-close]').forEach(b =>
            b.addEventListener('click', () => b.closest('dialog').close()));
        $('export-btn').addEventListener('click', exportBackup);
        $('import-btn').addEventListener('click', () => $('import-file').click());
        $('import-file').addEventListener('change', e => {
            if (e.target.files[0]) importBackup(e.target.files[0]);
            e.target.value = '';
        });

        (async function init() {
            let saved = null;
            try { saved = localStorage.getItem('frida-tab'); } catch (e) {}
            try {
                entries = await getAll();
            } catch (err) {
                toast('This browser is blocking storage, so entries will not be saved.');
            }
            setMode(TYPES[saved] ? saved : 'recipe');
        })();
    </script>
</body>
</html>
